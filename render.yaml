services:
  # 1. FastAPI ML Microservice (Disease Detection + Gemini Vision Validation + Mandi Prices)
  - type: web
    name: krushi-ml-service
    runtime: python
    rootDir: ml_service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false

  # 2. Spring Boot Core Backend (Users, Authentication, Marketplace, Chat, Schemes)
  - type: web
    name: krushi-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krushi-postgres
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: krushi-ml-service
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false

databases:
  # 3. PostgreSQL Database (Flyway migrations, marketplace orders, and chat tables)
  - name: krushi-postgres
    plan: free
    region: oregon
    databaseName: krushiaadhar
    user: krushi_user
