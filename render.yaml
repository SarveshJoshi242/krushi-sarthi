services:
  # 1. FastAPI ML Microservice (Disease Detection + Gemini Vision Validation + Mandi Prices)
  - type: web
    name: krushi-ml-service
    runtime: python
    rootDir: ml_service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: BACKEND_PUBLIC_URL
        value: https://krushi-backend-y60p.onrender.com

  # 2. Spring Boot Core Backend (Users, Authentication, Marketplace, Chat, Schemes)
  - type: web
    name: krushi-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: krushi-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: krushi-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: krushi-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: krushi-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: krushi-postgres
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: krushi-postgres
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: krushi-ml-service
          property: hostport
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_PUBLIC_URL
        value: https://krushi-ml-service-6xfo.onrender.com

databases:
  # 3. PostgreSQL Database (Flyway migrations, marketplace orders, and chat tables)
  - name: krushi-postgres
    plan: free
    region: oregon
    databaseName: krushiaadhar
    user: krushi_user
