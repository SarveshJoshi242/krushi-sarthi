spring.application.name=krishi-aadhar
spring.main.allow-bean-definition-overriding=true

# Import local .env file optionally
spring.config.import=optional:file:.env[.local]

# Database configuration using environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:krushiaadhar}
spring.datasource.username=${DB_USER:krushi_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:krushiaadhar}
spring.flyway.user=${DB_USER:krushi_user}
spring.flyway.password=${DB_PASSWORD:}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Actuator Probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# Weather API
weather.api.key=${OPENWEATHERMAP_API_KEY:}
weather.api.base-url=https://api.openweathermap.org/data/2.5

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}

# ML Service
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# WebSocket
spring.websocket.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# JWT Security
jwt.secret=${JWT_SECRET:super_secret_jwt_key_that_is_long_enough_for_hmac_sha256_algorithm_1234567890}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

